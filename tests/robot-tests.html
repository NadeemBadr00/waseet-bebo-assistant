<!doctype html><html><head><meta charset="utf-8"><title>Bebo v2 checks</title>
<style>body{font:14px system-ui;background:#161a23;color:#d8e1f5;margin:16px}#area{position:fixed;left:16px;top:50px;width:min(540px,calc(100vw - 32px));height:300px;background:#252b39;border:1px solid #46516a}#results{margin-top:340px;white-space:pre-wrap;font:12px/1.5 Consolas}#summary{position:fixed;top:8px;left:16px;z-index:4;background:#161a23}</style>
<script src="http://127.0.0.1:8765/robot.js?v=2"></script></head><body>
<h3 id="summary">Running interaction checks…</h3><div id="area"><cute-robot id="robot" size="128" movable interactive></cute-robot></div><pre id="results"></pre>
<script>
(async()=>{
const robot=document.querySelector('#robot'),area=document.querySelector('#area'),log=document.querySelector('#results');
let passed=0,failed=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const check=(name,ok,detail='')=>{log.textContent+=(ok?'PASS ':'FAIL ')+name+(detail?' — '+detail:'')+'\n';ok?passed++:failed++;};
const button=()=>robot.shadowRoot.querySelector('button');
const frame=()=>robot.shadowRoot.querySelector('.sprite').dataset.frame;
const pointer=(type,x,y,id=1,pointerType='mouse')=>button().dispatchEvent(new PointerEvent(type,{bubbles:true,pointerId:id,pointerType,isPrimary:true,button:0,clientX:x,clientY:y}));
try{
await customElements.whenDefined('cute-robot');await wait(150);
check('Registered and visible',!!robot.shadowRoot&&Math.abs(robot.getBoundingClientRect().width-128)<1);
for(const name of ['robot-sprites.png','robot-actions.png','robot-speaking.png','robot-antics.png']){
 const img=new Image();const loaded=new Promise(resolve=>{img.onload=()=>resolve(true);img.onerror=()=>resolve(false);});img.src='http://127.0.0.1:8765/'+name;
 check(name+' loads',await loaded&&img.naturalWidth===1774);
}
for(const state of ['idle','blink','wave','happy','thinking','sleep','walk','typing','jump','land','drag','rest']){
 robot.play('idle');robot.play(state);check('Pose '+state,robot.state===state);
}
robot.setTyping();check('Laptop action atlas',robot.shadowRoot.querySelector('.sprite').dataset.atlas==='action'&&frame()==='2');
await wait(215);check('Typing alternates hands',frame()==='3',frame());
robot.paused=true;const pausedFrame=frame(),pausedPosition=robot.position;await wait(230);
check('Pause freezes frames and position',frame()===pausedFrame&&robot.position.x===pausedPosition.x);
robot.paused=false;robot.resetPosition();
const start=robot.position.x,target=Math.min(start+30,area.clientWidth-128);
robot.walkTo(target);await wait(650);check('Walk reaches target and returns idle',Math.abs(robot.position.x-target)<1&&robot.state==='idle',JSON.stringify(robot.position));
robot.resetPosition();pointer('pointerenter',0,0);check('Mouse hover triggers jump',robot.state==='jump');
await wait(1050);check('Jump lands and resumes idle',robot.state==='idle',robot.state);
robot.setTyping();robot.jump();await wait(1050);check('Jump resumes interrupted typing',robot.state==='typing',robot.state);
robot.resetPosition();pointer('pointerdown',100,200);pointer('pointermove',5000,-5000);
check('Drag shows held pose',robot.state==='drag'&&robot.hasAttribute('data-dragging'));
check('Drag clamps to container',robot.position.x<=area.clientWidth-128&&robot.position.y===0,JSON.stringify(robot.position));
pointer('pointerup',5000,-5000);button().dispatchEvent(new MouseEvent('click',{bubbles:true}));
check('Drop suppresses accidental click',robot.state!=='wave');
await wait(2300);check('Drop falls, lands and takes steps',robot.state==='idle'&&Math.abs(robot.position.y-(area.clientHeight-128))<1,robot.state);
robot.resetPosition();pointer('pointerdown',150,200,2);pointer('pointermove',-500,-500,2);pointer('pointercancel',-500,-500,2);
check('Cancelled drag releases safely',!robot.hasAttribute('data-dragging')&&robot.state==='idle'&&robot.position.y===area.clientHeight-128);
robot.resetPosition();pointer('pointerdown',50,150,3,'touch');pointer('pointermove',70,50,3,'touch');
check('Touch dragging updates position',robot.state==='drag'&&robot.position.y<area.clientHeight-128);
pointer('pointerup',70,50,3,'touch');await wait(2100);check('Touch release settles',robot.state==='idle');
robot.setAttribute('size','512');await wait(80);
const r=robot.getBoundingClientRect(),a=area.getBoundingClientRect();
check('Oversized robot fits bounds',r.width<=area.clientWidth&&r.right<=a.right+1&&r.bottom<=a.bottom+1);
robot.setAttribute('size','128');robot.resetPosition();
robot.setAttribute('state','__proto__');check('Invalid state falls back safely',robot.state==='idle');robot.play('idle');
robot.remove();await wait(80);check('Disconnect cancels animation',robot._raf===0);
area.append(robot);await wait(100);robot.setTyping();check('Reconnect works',robot.state==='typing');
robot.play('idle');robot.setAttribute('roam','');await wait(6500);
check('Optional autonomy starts an activity',['walk','typing','rest','scratch','dance','fly'].includes(robot.state),robot.state);
robot.removeAttribute('roam');robot.resetPosition();
const realMotion=robot._motion; robot._motion={matches:true};
robot.walkTo(0);check('Reduced motion snaps walking',robot.position.x===0&&robot.state==='idle');
robot.jump();check('Reduced motion suppresses jumping',robot.state==='idle');
robot.setTyping();await wait(210);check('Reduced motion keeps typing pose static',frame()==='2');
robot._motion=realMotion;robot.play('idle');

robot.play('speaking',{loop:true});robot.setSpeechLevel(.8);const speechFrames=[];const changed=[];
const speechStart=performance.now();let previousFrame=frame();
for(let i=0;i<28;i++){await wait(50);speechFrames.push(frame());if(frame()!==previousFrame){changed.push(performance.now()-speechStart);previousFrame=frame();}}
check('Talking uses new atlas',robot.shadowRoot.querySelector('.sprite').dataset.atlas==='speech');
check('Speech is deliberately slow, at most four changes in 1.4 seconds',changed.length>=1&&changed.length<=4,JSON.stringify(changed.map(Math.round)));
check('Speech holds each mouth pose at least 330ms',changed.slice(1).every((x,i)=>x-changed[i]>=330));
robot.setSpeechLevel(0);await wait(1050);check('Mouth settles closed after silence',frame()==='0');
robot.setSpeechLevel(.8);robot.paused=true;const stillMouth=frame();await wait(500);check('Speech meter cannot animate a paused character',frame()===stillMouth);robot.paused=false;robot.setSpeechLevel(null);
robot.play('scratch');await wait(750);check('Scratch uses hand-at-head frame',frame()==='1'&&robot.state==='scratch');
robot.play('dance');const danceA=frame();await wait(770);check('Dance steps switch at a gentle pace',robot.state==='dance'&&danceA!==frame());
robot.play('fly');await wait(300);check('Fly is visible during orbit',getComputedStyle(robot.shadowRoot.querySelector('.bug')).display!=='none');
robot.paused=true;const flyTime=robot._elapsed;await wait(200);check('Pausing freezes the fly story',robot._elapsed===flyTime&&getComputedStyle(robot.shadowRoot.querySelector('.bug')).animationPlayState==='paused');
robot.paused=false;robot.play('fly');await wait(5950);check('Fly approaches open mouth',robot.state==='catch',robot.state);
await wait(1360);check('Catch becomes satisfied chewing',robot.state==='chew'&&getComputedStyle(robot.shadowRoot.querySelector('.bug')).display==='none',robot.state);
await wait(2500);check('Fly story returns to idle',robot.state==='idle',robot.state);
robot.play('fly');robot.play('listening');await wait(100);check('Listening interrupts antics and hides the fly',robot.state==='listening'&&getComputedStyle(robot.shadowRoot.querySelector('.bug')).display==='none');
robot._motion={matches:true};robot.play('dance');const reducedDance=frame();await wait(780);check('Reduced motion keeps dancing static',frame()===reducedDance);
robot._motion=realMotion;robot.play('idle');

}catch(error){check('Unhandled exception',false,error.stack);}
document.querySelector('#summary').textContent=passed+' passed · '+failed+' failed';
document.title=failed?'FAIL — Bebo tests':'PASS — Bebo tests';
})();
</script></body></html>
